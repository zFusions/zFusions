<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">zFusions — Independent developer</title>
  <desc id="desc">A vibrant indigo, violet and cyan geometric banner for the zFusions GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11102b"/>
      <stop offset=".52" stop-color="#24115a"/>
      <stop offset="1" stop-color="#082b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b5cff"/>
      <stop offset=".52" stop-color="#626bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".48"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#c4b5fd" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <ellipse cx="970" cy="110" rx="300" ry="220" fill="url(#glow)"/>
  <path d="M770 -20 1040 -20 1260 200 1260 330 1120 330 850 70Z" fill="#7c3aed" opacity=".12"/>
  <path d="M930 -30h110l210 210v80h-50L930 0Z" fill="#22d3ee" opacity=".10"/>
  <path d="M760 300 1010 50h110L870 300Z" fill="url(#accent)" opacity=".18"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".7">
    <path d="M850 44h120l34 34v120"/>
    <path d="M900 44v70l-35 35h-75"/>
    <path d="M1090 70h-55l-40 40v105"/>
    <circle cx="1004" cy="78" r="5" fill="#22d3ee" stroke="none"/>
    <circle cx="790" cy="149" r="4" fill="#a78bfa" stroke="none"/>
    <circle cx="1090" cy="215" r="5" fill="#22d3ee" stroke="none"/>
  </g>
  <g transform="translate(76 76)">
    <rect width="5" height="148" rx="2.5" fill="url(#accent)"/>
    <text x="34" y="66" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-2">zFusions</text>
    <text x="37" y="111" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="4">INDEPENDENT DEVELOPER</text>
    <text x="37" y="145" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" opacity=".85">Building software, tools &amp; digital experiences.</text>
  </g>
  <g transform="translate(1000 148)">
    <circle r="63" fill="#0b1028" stroke="url(#accent)" stroke-width="2"/>
    <circle r="49" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-dasharray="3 8"/>
    <path d="M-22-20h44v12H-7l-15 28v12h44V20H0l15-28v-12Z" fill="url(#accent)"/>
    <path d="M-34 0h-10M34 0h10M0-78v-10M0 78v10" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>
  <path d="M76 258h1048" stroke="url(#accent)" stroke-opacity=".65"/>
  <text x="76" y="280" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="3">DESIGN  /  ENGINEERING  /  AUTOMATION</text>
</svg>